<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Für Giada ❤</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9dfcc;
    --paper: #f6efe1;
    --field: #fffaf1;
    --ink: #1c1916;
    --muted: #6d645a;
    --red: #c62e35;
    --red-dark: #9e2229;
    --gold: #d8b47b;
    --steel-1: #3b3835;
    --steel-2: #1f1d1b;
    --ok: #2f7d4f;
    --w-correct: #4f9a5c;
    --w-present: #d4a332;
    --w-absent: #8b847b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--bg);
    background-image: radial-gradient(rgba(28,25,22,.07) 1px, transparent 1px);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: "Patrick Hand", "Comic Sans MS", system-ui, sans-serif;
    font-size: 20px;
    line-height: 1.35;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }
  button { font: inherit; cursor: pointer; color: inherit; -webkit-tap-highlight-color: transparent; }
  .hand { font-family: "Caveat", cursive; }
  .muted { color: var(--muted); }
  .small { font-size: 17px; }
  p { margin: 10px 0; }
  h1 { font-size: clamp(42px, 11vw, 64px); line-height: 1; margin: 8px 0 6px; font-weight: normal; -webkit-text-stroke: 1.2px var(--ink); }
  h2 { font-size: clamp(28px, 7vw, 36px); line-height: 1.1; margin: 4px 0 8px; font-weight: normal; }
  h3 { font-size: 26px; line-height: 1.2; margin: 6px 0 4px; font-weight: normal; }
  .sub { font-size: 28px; line-height: 1.15; }
  [hidden] { display: none !important; }

  #app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 18px; }

  /* ---------- Karte ---------- */
  .card {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 22px;
    padding: 10px;
    box-shadow: 0 10px 30px rgba(28,25,22,.13);
  }
  .card-inner { border: 2px solid var(--ink); border-radius: 14px; padding: 22px 26px 24px; text-align: center; }
  @media (max-width: 480px) { .card-inner { padding: 18px 12px 20px; } }
  .deco { display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--red); font-size: 26px; }
  .deco::before, .deco::after { content: ""; width: 34px; height: 3px; background: var(--ink); border-radius: 2px; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-block;
    font-size: 22px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 7px 26px;
    background: var(--red);
    color: #fff;
    box-shadow: 0 4px 0 var(--ink);
    transition: transform .08s, box-shadow .08s, background .15s;
    text-decoration: none;
  }
  .btn:hover { background: var(--red-dark); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn-ghost { background: transparent; border: 2px dashed var(--ink); border-radius: 999px; padding: 4px 16px; font-size: 18px; }
  .btn-ghost:hover { background: rgba(198,46,53,.08); }
  .btn-link { background: none; border: none; color: var(--muted); font-size: 16px; text-decoration: underline; padding: 4px; }

  .feedback { min-height: 1.4em; font-size: 22px; margin: 6px 0; }
  .feedback.bad { color: var(--red); }
  .feedback.good { color: var(--ok); }

  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  /* ---------- Tresor ---------- */
  .vault {
    background: linear-gradient(150deg, var(--steel-1), var(--steel-2));
    border: 3px solid var(--ink);
    border-radius: 22px;
    padding: 10px;
    color: var(--paper);
    text-align: center;
    box-shadow: 0 10px 30px rgba(28,25,22,.25), inset 0 1px 0 rgba(255,255,255,.12);
    position: relative;
  }
  .vault-inner { border: 2px dashed rgba(216,180,123,.55); border-radius: 14px; padding: 18px 12px 18px; }
  .vault-head { font-size: 30px; letter-spacing: .25em; color: var(--gold); margin: 0; }
  .vault-text { font-size: 18px; color: rgba(246,239,225,.8); margin: 4px 0 0; }
  .digits { display: flex; justify-content: center; gap: 8px; margin: 16px 0 14px; }
  .digit { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .digit small { font-size: 14px; color: rgba(246,239,225,.55); }
  .digit input {
    width: 46px; height: 60px;
    text-align: center;
    font: inherit; font-size: 34px;
    border-radius: 10px;
    border: 2px solid var(--gold);
    background: #121110;
    color: #fff;
    caret-color: var(--gold);
    outline: none;
    padding: 0;
  }
  .digit input:focus { box-shadow: 0 0 0 3px rgba(216,180,123,.45); }
  @media (max-width: 380px) {
    .digits { gap: 5px; }
    .digit input { width: 40px; height: 54px; font-size: 30px; }
  }
  .btn.gold { background: var(--gold); color: var(--ink); border-color: #000; box-shadow: 0 4px 0 #000; }
  .btn.gold:hover { background: #e6c48e; }
  .vault .feedback.bad { color: #ffb3b3; }
  .vault .feedback { font-size: 20px; margin-bottom: 0; }

  /* ---------- Rätsel-Übersicht ---------- */
  .section-title { text-align: center; margin: 6px 0 -4px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 520px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .tile {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 16px 8px 12px;
    box-shadow: 0 4px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  .tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .tile .num {
    position: absolute; top: 7px; left: 8px;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--ink); color: var(--paper);
    font-size: 15px; display: grid; place-items: center;
  }
  .tile .icon { font-size: 40px; line-height: 1.1; }
  .tile .name { font-size: 20px; line-height: 1.1; }
  .tile .status { font-size: 16px; color: var(--muted); }
  .tile.solved { background: #fff1ef; }
  .tile.solved .num { background: var(--red); }
  .tile.solved .status { color: var(--red); }

  /* ---------- Rätsel-Ansicht ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .p-icon { font-size: 46px; line-height: 1; }
  .solved-note { background: #fff1ef; border: 2px dashed var(--red); border-radius: 12px; padding: 6px 12px; font-size: 18px; }
  .reward { margin-top: 10px; }
  .big-digit {
    display: inline-grid; place-items: center;
    width: 92px; height: 112px;
    font-size: 78px;
    background: var(--steel-2); color: #fff;
    border: 3px solid var(--gold); border-radius: 16px;
    margin: 6px 0;
  }
  .stats { display: flex; justify-content: center; gap: 26px; font-size: 21px; margin: 6px 0; }

  /* Antwortfeld (Über uns) */
  .answer-row { display: flex; gap: 10px; margin: 14px 0 6px; }
  .answer-row input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 22px;
    padding: 7px 14px;
    border: 3px solid var(--ink); border-radius: 14px;
    background: var(--field); color: var(--ink);
    outline: none;
  }
  .answer-row input:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(198,46,53,.15); }
  @media (max-width: 420px) { .answer-row { flex-direction: column; } }
  .hints { list-style: none; padding: 0; margin: 8px 0 4px; }
  .hints li { background: #fff6dc; border: 2px dashed var(--gold); border-radius: 12px; padding: 6px 12px; margin: 8px 0; font-size: 19px; }
  .hints li::before { content: "💡 "; }

  /* Wordle */
  .wd-board { display: grid; gap: 6px; justify-content: center; margin: 12px 0 6px; }
  .wd-row { display: grid; grid-auto-flow: column; gap: 6px; }
  .wd-cell {
    width: 50px; height: 50px;
    border: 2px solid #cbbfa9; border-radius: 6px;
    display: grid; place-items: center;
    font-size: 28px; text-transform: uppercase;
    background: var(--field);
    transition: background .3s, border-color .3s, color .3s;
  }
  .wd-cell.filled { border-color: var(--ink); }
  .wd-cell.flip { animation: flip .4s; }
  @keyframes flip { 50% { transform: rotateX(90deg); } }
  @media (max-width: 380px) { .wd-cell { width: 44px; height: 44px; } }
  .correct { background: var(--w-correct) !important; border-color: var(--w-correct) !important; color: #fff !important; }
  .present { background: var(--w-present) !important; border-color: var(--w-present) !important; color: #fff !important; }
  .absent { background: var(--w-absent) !important; border-color: var(--w-absent) !important; color: #fff !important; }
  .kb { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; user-select: none; }
  .kb-row { display: flex; justify-content: center; gap: 4px; }
  .key {
    flex: 1; max-width: 42px; min-width: 0; height: 50px; padding: 0;
    font-size: 19px;
    border: 2px solid var(--ink); border-radius: 8px;
    background: var(--field);
    box-shadow: 0 2px 0 var(--ink);
  }
  .key:active { transform: translateY(2px); box-shadow: none; }
  .key.wide { flex: 1.6; max-width: 66px; font-size: 16px; }
  .howto { text-align: left; font-size: 17px; margin-top: 10px; }
  .howto summary { cursor: pointer; color: var(--muted); }
  .chip { display: inline-block; padding: 0 7px; border-radius: 5px; color: #fff; }

  /* Memory */
  .mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 340px; margin: 10px auto; perspective: 700px; }
  .mem-card { aspect-ratio: 1; position: relative; border: none; background: none; padding: 0; transform-style: preserve-3d; transition: transform .35s; }
  .mem-card.open, .mem-card.matched { transform: rotateY(180deg); }
  .mem-face {
    position: absolute; inset: 0;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 10px; border: 2px solid var(--ink);
    display: grid; place-items: center;
  }
  .mem-front { background: radial-gradient(circle, rgba(255,255,255,.7) 2px, transparent 3px) 0 0 / 14px 14px, var(--red); color: #fff; font-size: 24px; }
  .mem-back { background: var(--field); transform: rotateY(180deg); font-size: clamp(26px, 8vw, 38px); }
  .mem-card.matched .mem-back { background: #e3f3e6; }

  /* Schiebepuzzle */
  .slide { position: relative; width: min(290px, 78vw); aspect-ratio: 1; margin: 12px auto; background: var(--ink); border: 4px solid var(--ink); border-radius: 12px; }
  .slide-tile { position: absolute; left: 0; top: 0; width: calc(100% / 3); height: calc(100% / 3); padding: 3px; border: none; background: none; transition: transform .15s; }
  .slide-tile span { display: grid; place-items: center; width: 100%; height: 100%; background: var(--paper); border-radius: 8px; font-size: 36px; }
  .slide.solved .slide-tile span { background: #e3f3e6; }
  .goal { display: inline-grid; grid-template-columns: repeat(3, 18px); gap: 2px; vertical-align: middle; font-size: 13px; }
  .goal span { background: var(--paper); border: 1px solid var(--ink); border-radius: 3px; line-height: 16px; }
  .goal span:last-child { background: var(--ink); }

  /* Labyrinth */
  .maze-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 8px; }
  canvas.maze { width: min(340px, 82vw); aspect-ratio: 1; background: var(--field); border-radius: 6px; touch-action: none; }
  .dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 50px); gap: 6px; }
  .dpad button { font-size: 22px; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); box-shadow: 0 3px 0 var(--ink); touch-action: manipulation; }
  .dpad button:active { transform: translateY(2px); box-shadow: none; }

  /* Herzen fangen */
  .holes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 300px; margin: 12px auto; }
  .hole {
    aspect-ratio: 1; padding: 0;
    border-radius: 50%; border: 3px solid var(--ink);
    background: radial-gradient(circle at 50% 65%, #d6c9b1, #b9a98f);
    font-size: 46px;
    display: grid; place-items: center;
    touch-action: manipulation; user-select: none;
  }
  .hole .h { transform: scale(0); transition: transform .1s; pointer-events: none; }
  .hole.up .h { transform: scale(1); }
  .hole.hit { background: #f7cfd2; }
  .hole.miss { background: #9a9087; }

  /* Finale */
  .stage { position: relative; overflow: hidden; border: 3px solid var(--ink); border-radius: 10px; background: #fff; aspect-ratio: 3 / 2; margin: 14px 0; perspective: 1400px; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .door {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(150deg, var(--steel-1), var(--steel-2));
    display: grid; place-items: center;
    transform-origin: left center;
    transition: transform 1.6s cubic-bezier(.6,0,.3,1), opacity .5s 1.2s;
  }
  .door::after { content: ""; position: absolute; inset: 10px; border: 2px dashed rgba(216,180,123,.5); border-radius: 8px; }
  .wheel { width: 84px; height: 84px; border-radius: 50%; border: 8px solid var(--gold); position: relative; transition: transform 1s ease-in-out; }
  .wheel::before, .wheel::after { content: ""; position: absolute; left: 50%; top: -8px; bottom: -8px; width: 8px; margin-left: -4px; background: var(--gold); }
  .wheel::after { transform: rotate(90deg); }
  .stage.turn .wheel { transform: rotate(360deg); }
  .stage.open .door { transform: rotateY(-100deg); opacity: 0; }

  .confetti { position: fixed; top: -40px; pointer-events: none; z-index: 50; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(var(--rot)); } }

  footer { margin-top: 22px; text-align: center; }
</style>
</head>

<script>
(() => {
  const DATA = JSON.parse(document.getElementById("quiz-data").textContent);
  const DEBUG = false;
  const STORE_KEY = "tresor-v1";
  const N = DATA.puzzles.length;
  const app = document.getElementById("app");
  const resetBtn = document.getElementById("reset");

  const TYPES = {
    wordle: { title: "Wort-Rätsel", icon: "🔤", desc: "Errate das geheime Wort.", run: runWordle },
    memory: { title: "Paare finden", icon: "🃏", desc: "Decke immer zwei Karten auf und finde alle Paare.", run: runMemory },
    slide:  { title: "Schiebepuzzle", icon: "🧩", desc: "Bring die Zahlen in die richtige Reihenfolge.", run: runSlide },
    maze:   { title: "Labyrinth", icon: "🌀", desc: "Finde den Weg durch das Labyrinth.", run: runMaze },
    catch:  { title: "Herzen fangen", icon: "💘", desc: "Fang genug Herzen, bevor die Zeit abläuft.", run: runCatch },
    quiz:   { title: "Über uns", icon: "💑", desc: "Fragen, die nur du beantworten kannst.", run: runQuiz },
  };

  const WRONG = ["Fast! Versuch's nochmal 😘", "Hmm, nicht ganz … 🤔", "Leider nein – aber du bist nah dran! 💪", "Nope 🙈 Noch ein Versuch?"];
  const RIGHT = ["Richtig! 🎉", "Genau! 😍", "Perfekt! ⭐", "Jaaa! ❤️"];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const shake = el => { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); };

  // ---------- Fortschritt ----------
  let state = { digits: {}, code: "" };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && typeof saved === "object" && saved.digits) state = saved;
  } catch (e) {}
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} };

  resetBtn.addEventListener("click", () => {
    if (!confirm("Wirklich alles zurücksetzen? Gelöste Rätsel gehen verloren.")) return;
    state = { digits: {}, code: "" };
    save();
    vaultResult = null;
    if (location.hash) location.hash = ""; else route();
  });

  // ---------- Krypto (muss zu build.py passen) ----------
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  function normalize(s) {
    s = s.toLowerCase().replace(/ß/g, "ss");
    s = s.normalize("NFD").replace(/[̀-ͯ]/g, "");
    s = s.replace(/^\s*(der|die|das|ein|eine|einen|the|a|an|il|la|le|lo|el|un|una)\s+/, "");
    s = s.replace(/[^a-z0-9]/g, "");
    return s.replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u");
  }

  async function deriveKeys(password, salt, iterations) {
    const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: "PBKDF2", hash: "SHA-256", salt, iterations }, base, 512));
    const hmacKey = raw => crypto.subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    return { enc: await hmacKey(bits.slice(0, 32)), mac: await hmacKey(bits.slice(32)) };
  }

  async function unseal(keys, blob) {
    const nonce = b64(blob.n), ct = b64(blob.c), tag = b64(blob.t);
    const signed = new Uint8Array(nonce.length + ct.length);
    signed.set(nonce); signed.set(ct, nonce.length);
    const expected = new Uint8Array(await crypto.subtle.sign("HMAC", keys.mac, signed));
    if (expected.length !== tag.length || expected.some((b, i) => b !== tag[i])) return null;

    const out = new Uint8Array(ct.length);
    const blocks = Math.ceil(ct.length / 32);
    const BATCH = 1024;
    for (let start = 0; start < blocks; start += BATCH) {
      const jobs = [];
      for (let i = start; i < Math.min(blocks, start + BATCH); i++) {
        const msg = new Uint8Array(nonce.length + 4);
        msg.set(nonce);
        new DataView(msg.buffer).setUint32(nonce.length, i);
        jobs.push(crypto.subtle.sign("HMAC", keys.enc, msg));
      }
      const streams = await Promise.all(jobs);
      streams.forEach((buf, j) => {
        const ks = new Uint8Array(buf), off = (start + j) * 32;
        for (let x = 0; x < 32 && off + x < ct.length; x++) out[off + x] = ct[off + x] ^ ks[x];
      });
    }
    return out;
  }

  async function openSecret(p, password) {
    const keys = await deriveKeys(password, b64(p.salt), p.iters);
    const plain = await unseal(keys, p.secret);
    return plain ? JSON.parse(dec.decode(plain)) : null;
  }

  async function checkAnswer(q, input) {
    const norm = normalize(input);
    if (!norm) return null;
    const keys = await deriveKeys(norm, b64(q.salt), q.iters);
    for (const blob of q.blobs) {
      const plain = await unseal(keys, blob);
      if (plain) return dec.decode(plain);
    }
    return null;
  }

  let vaultResult = null;
  async function tryVault(code) {
    const v = DATA.vault;
    const keys = await deriveKeys(code, b64(v.salt), v.iters);
    const image = await unseal(keys, v.blob);
    if (!image) return null;
    const message = await unseal(keys, v.message);
    return { image, message: message ? dec.decode(message) : "" };
  }

  // ---------- Spiel 1: Wordle ----------
  const KB = [[..."QWERTZUIOP"], [..."ASDFGHJKL"], ["ENTER", ..."YXCVBNM", "BACK"]];

  function scoreGuess(guess, word) {
    const res = Array(word.length).fill("absent");
    const left = {};
    for (let x = 0; x < word.length; x++) {
      if (guess[x] === word[x]) res[x] = "correct";
      else left[word[x]] = (left[word[x]] || 0) + 1;
    }
    for (let x = 0; x < word.length; x++) {
      if (res[x] !== "correct" && left[guess[x]] > 0) { res[x] = "present"; left[guess[x]]--; }
    }
    return res;
  }

  function runWordle(el, p, win) {
    let alive = true, onKey = null;
    el.innerHTML = '<p class="muted">Einen Moment …</p>';
    openSecret(p, p.token).then(s => { if (alive && s) start(s.word); });

    function start(word) {
      const L = word.length, ROWS = 6, FLIP = 160;
      let row = 0, cur = "", over = false;
      const keyState = {};
      el.innerHTML = `
        <p style="margin:0">Das Wort hat <b>${L}</b> Buchstaben. Du hast ${ROWS} Versuche.</p>
        ${p.hint ? `<p class="hand sub" style="margin:4px 0">Tipp: ${esc(p.hint)}</p>` : ""}
        <div class="wd-board">${Array.from({ length: ROWS }, () =>
          `<div class="wd-row">${'<div class="wd-cell"></div>'.repeat(L)}</div>`).join("")}</div>
        <div class="feedback" id="wdFb"></div>
        <div class="kb">${KB.map(r => `<div class="kb-row">${r.map(k =>
          `<button type="button" class="key${k.length > 1 ? " wide" : ""}" data-k="${k}">${k === "BACK" ? "⌫" : k === "ENTER" ? "OK" : k}</button>`).join("")}</div>`).join("")}</div>
        <details class="howto"><summary>So funktioniert's</summary>
          <p>Tippe ein Wort mit ${L} Buchstaben und drücke OK. Danach färben sich die Felder:</p>
          <p><span class="chip correct">grün</span> richtiger Buchstabe am richtigen Platz<br>
             <span class="chip present">gelb</span> Buchstabe kommt vor, aber an einer anderen Stelle<br>
             <span class="chip absent">grau</span> Buchstabe kommt nicht vor</p>
        </details>`;
      const rows = [...el.querySelectorAll(".wd-row")];
      const fb = el.querySelector("#wdFb");

      const paint = () => {
        const cells = rows[row].children;
        for (let x = 0; x < L; x++) {
          cells[x].textContent = cur[x] || "";
          cells[x].classList.toggle("filled", !!cur[x]);
        }
      };

      function submit() {
        if (cur.length < L) {
          fb.className = "feedback bad";
          fb.textContent = `Das Wort braucht ${L} Buchstaben.`;
          shake(rows[row]);
          return;
        }
        const guess = cur, res = scoreGuess(guess, word), cells = rows[row].children;
        res.forEach((r, x) => setTimeout(() => cells[x].classList.add(r, "flip"), x * FLIP));
        const rank = { absent: 1, present: 2, correct: 3 };
        [...guess].forEach((c, x) => { if ((rank[keyState[c]] || 0) < rank[res[x]]) keyState[c] = res[x]; });
        setTimeout(() => el.querySelectorAll(".key").forEach(b => {
          b.classList.remove("absent", "present", "correct");
          if (keyState[b.dataset.k]) b.classList.add(keyState[b.dataset.k]);
        }), L * FLIP);
        fb.className = "feedback"; fb.textContent = "";
        row++; cur = "";
        if (guess === word) {
          over = true;
          setTimeout(() => win(p.token), L * FLIP + 400);
        } else if (row >= ROWS) {
          over = true;
          setTimeout(() => {
            fb.className = "feedback bad";
            fb.innerHTML = 'Leider nicht geschafft 😕<br><button class="btn" id="again" type="button">Nochmal versuchen</button>';
            el.querySelector("#again").addEventListener("click", () => start(word));
          }, L * FLIP + 300);
        }
      }

      function press(k) {
        if (over) return;
        if (k === "BACK") { cur = cur.slice(0, -1); paint(); }
        else if (k === "ENTER") submit();
        else if (/^[A-Z]$/.test(k) && cur.length < L) { cur += k; paint(); }
      }

      el.querySelector(".kb").addEventListener("click", e => {
        const b = e.target.closest(".key");
        if (b) press(b.dataset.k);
      });
      if (onKey) document.removeEventListener("keydown", onKey);
      onKey = e => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const k = e.key === "Enter" ? "ENTER" : e.key === "Backspace" ? "BACK" : e.key.toUpperCase();
        if (k === "ENTER" || k === "BACK" || /^[A-Z]$/.test(k)) { e.preventDefault(); press(k); }
      };
      document.addEventListener("keydown", onKey);
    }

    return () => { alive = false; if (onKey) document.removeEventListener("keydown", onKey); };
  }

  // ---------- Spiel 2: Memory ----------
  function runMemory(el, p, win) {
    const emojis = (Array.isArray(p.emojis) && p.emojis.length >= 2 ? p.emojis : ["🌻", "🐱", "🍓", "🌈", "🦋", "🍕", "☕", "🎈"]).slice(0, 8);
    const deck = shuffle([...emojis, ...emojis]);
    let first = null, lock = false, matched = 0, tries = 0, timer = null;
    el.innerHTML = `
      <div class="stats"><span>Versuche: <b id="tries">0</b></span><span>Paare: <b id="pairs">0</b> / ${emojis.length}</span></div>
      <div class="mem">${deck.map((e, i) => `
        <button type="button" class="mem-card" data-i="${i}" aria-label="Karte ${i + 1}">
          <span class="mem-face mem-front">?</span><span class="mem-face mem-back">${esc(e)}</span>
        </button>`).join("")}</div>`;
    const triesEl = el.querySelector("#tries"), pairsEl = el.querySelector("#pairs");

    el.querySelector(".mem").addEventListener("click", e => {
      const card = e.target.closest(".mem-card");
      if (!card || lock || card.classList.contains("open") || card.classList.contains("matched")) return;
      card.classList.add("open");
      if (!first) { first = card; return; }
      tries++;
      triesEl.textContent = tries;
      const a = first, b = card;
      first = null;
      if (deck[a.dataset.i] === deck[b.dataset.i]) {
        a.classList.add("matched"); b.classList.add("matched");
        matched += 2;
        pairsEl.textContent = matched / 2;
        if (matched === deck.length) timer = setTimeout(() => win(p.token), 700);
      } else {
        lock = true;
        timer = setTimeout(() => { a.classList.remove("open"); b.classList.remove("open"); lock = false; }, 900);
      }
    });
    return () => clearTimeout(timer);
  }

  // ---------- Spiel 3: Schiebepuzzle ----------
  function runSlide(el, p, win) {
    const S = 3, CELLS = S * S;
    let board, moves = 0, done = false, timer = null;
    const neighbors = idx => {
      const r = Math.floor(idx / S), c = idx % S, out = [];
      if (r > 0) out.push(idx - S);
      if (r < S - 1) out.push(idx + S);
      if (c > 0) out.push(idx - 1);
      if (c < S - 1) out.push(idx + 1);
      return out;
    };
    const isSolved = () => board.every((v, i) => v === (i === CELLS - 1 ? 0 : i + 1));

    function scramble() {
      do {
        board = [...Array(CELLS - 1).keys()].map(x => x + 1).concat(0);
        let empty = CELLS - 1, prev = -1;
        for (let k = 0; k < (p.shuffleMoves || 60); k++) {
          const opts = neighbors(empty).filter(x => x !== prev);
          const next = opts[Math.floor(Math.random() * opts.length)];
          board[empty] = board[next]; board[next] = 0;
          prev = empty; empty = next;
        }
      } while (isSolved());
      moves = 0; done = false;
    }

    el.innerHTML = `
      <div class="stats"><span>Züge: <b id="moves">0</b></span>
        <span>Ziel: <span class="goal">${[1, 2, 3, 4, 5, 6, 7, 8].map(v => `<span>${v}</span>`).join("")}<span></span></span></span></div>
      <div class="slide" id="slide">${[...Array(CELLS - 1).keys()].map(v =>
        `<button type="button" class="slide-tile" data-v="${v + 1}"><span>${v + 1}</span></button>`).join("")}</div>
      <p class="muted small">Tippe auf eine Zahl neben der Lücke, um sie zu verschieben.</p>
      <button class="btn-ghost" id="reshuffle" type="button">Neu mischen</button>`;
    const slide = el.querySelector("#slide"), movesEl = el.querySelector("#moves");
    const tiles = [...slide.querySelectorAll(".slide-tile")];

    function place() {
      tiles.forEach(t => {
        const idx = board.indexOf(+t.dataset.v);
        t.style.transform = `translate(${(idx % S) * 100}%, ${Math.floor(idx / S) * 100}%)`;
      });
      movesEl.textContent = moves;
      slide.classList.toggle("solved", done);
    }

    slide.addEventListener("click", e => {
      const t = e.target.closest(".slide-tile");
      if (!t || done) return;
      const idx = board.indexOf(+t.dataset.v), empty = board.indexOf(0);
      if (!neighbors(empty).includes(idx)) return;
      board[empty] = board[idx]; board[idx] = 0;
      moves++;
      if (isSolved()) { done = true; timer = setTimeout(() => win(p.token), 500); }
      place();
    });
    el.querySelector("#reshuffle").addEventListener("click", () => { if (!done) { scramble(); place(); } });

    scramble();
    place();
    if (DEBUG) window.__slide = { get board() { return board.slice(); } };
    return () => clearTimeout(timer);
  }

  // ---------- Spiel 4: Labyrinth ----------
  function runMaze(el, p, win) {
    const S = Math.max(5, Math.min(14, p.size || 9));
    const walls = Array.from({ length: S * S }, () => ({ n: 1, e: 1, s: 1, w: 1 }));
    const step = { n: -S, s: S, e: 1, w: -1 };
    const opposite = { n: "s", s: "n", e: "w", w: "e" };

    // Labyrinth erzeugen (Backtracking)
    const seen = new Array(S * S).fill(false), stack = [0];
    seen[0] = true;
    while (stack.length) {
      const cur = stack[stack.length - 1], r = Math.floor(cur / S), c = cur % S, opts = [];
      if (r > 0 && !seen[cur - S]) opts.push("n");
      if (r < S - 1 && !seen[cur + S]) opts.push("s");
      if (c < S - 1 && !seen[cur + 1]) opts.push("e");
      if (c > 0 && !seen[cur - 1]) opts.push("w");
      if (!opts.length) { stack.pop(); continue; }
      const d = opts[Math.floor(Math.random() * opts.length)], nx = cur + step[d];
      walls[cur][d] = 0; walls[nx][opposite[d]] = 0;
      seen[nx] = true;
      stack.push(nx);
    }

    let pos = 0, done = false, timer = null;
    const goal = S * S - 1, trail = new Set([0]);
    el.innerHTML = `
      <div class="maze-wrap">
        <canvas class="maze" id="maze"></canvas>
        <div class="dpad">
          <button type="button" data-d="n" style="grid-column:2" aria-label="hoch">▲</button>
          <button type="button" data-d="w" style="grid-column:1;grid-row:2" aria-label="links">◀</button>
          <button type="button" data-d="s" style="grid-column:2;grid-row:2" aria-label="runter">▼</button>
          <button type="button" data-d="e" style="grid-column:3;grid-row:2" aria-label="rechts">▶</button>
        </div>
        <p class="muted small" style="margin:0">Bring das ❤️ zum ⭐ – mit den Pfeilen, durch Wischen über das Feld oder mit der Tastatur.</p>
      </div>`;
    const canvas = el.querySelector("#maze"), ctx = canvas.getContext("2d");

    function draw() {
      const size = canvas.clientWidth, dpr = window.devicePixelRatio || 1;
      if (!size) return;
      canvas.width = size * dpr; canvas.height = size * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const pad = 3, cs = (size - pad * 2) / S;
      ctx.clearRect(0, 0, size, size);
      ctx.fillStyle = "rgba(198,46,53,.13)";
      trail.forEach(i => ctx.fillRect(pad + (i % S) * cs, pad + Math.floor(i / S) * cs, cs, cs));
      ctx.strokeStyle = "#1c1916"; ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath();
      walls.forEach((w, i) => {
        const x = pad + (i % S) * cs, y = pad + Math.floor(i / S) * cs;
        if (w.n) { ctx.moveTo(x, y); ctx.lineTo(x + cs, y); }
        if (w.w) { ctx.moveTo(x, y); ctx.lineTo(x, y + cs); }
        if (w.s) { ctx.moveTo(x, y + cs); ctx.lineTo(x + cs, y + cs); }
        if (w.e) { ctx.moveTo(x + cs, y); ctx.lineTo(x + cs, y + cs); }
      });
      ctx.stroke();
      ctx.fillStyle = "#000";
      ctx.font = `${cs * 0.68}px serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const center = i => [pad + (i % S + .5) * cs, pad + (Math.floor(i / S) + .55) * cs];
      ctx.fillText("⭐", ...center(goal));
      ctx.fillText("❤️", ...center(pos));
    }

    function move(d) {
      if (done || walls[pos][d]) return;
      pos += step[d];
      trail.add(pos);
      draw();
      if (pos === goal) { done = true; timer = setTimeout(() => win(p.token), 400); }
    }

    el.querySelector(".dpad").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (b) move(b.dataset.d);
    });
    const KEYS = { ArrowUp: "n", ArrowDown: "s", ArrowLeft: "w", ArrowRight: "e", w: "n", s: "s", a: "w", d: "e" };
    const onKey = e => { const d = KEYS[e.key]; if (d) { e.preventDefault(); move(d); } };
    document.addEventListener("keydown", onKey);
    let sx = null, sy = null;
    canvas.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
    canvas.addEventListener("pointerup", e => {
      if (sx === null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      sx = sy = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
      move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "e" : "w") : (dy > 0 ? "s" : "n"));
    });
    window.addEventListener("resize", draw);
    requestAnimationFrame(draw);
    if (DEBUG) window.__maze = { S, walls, move };

    return () => {
      clearTimeout(timer);
      document.removeEventListener("keydown", onKey);
      window.removeEventListener("resize", draw);
    };
  }

  // ---------- Spiel 5: Herzen fangen ----------
  function runCatch(el, p, win) {
    const TARGET = p.target || 15, SECONDS = p.seconds || 30;
    const HOLES = p.holes || 9;                 // Anzahl Löcher (Vielfaches von 3)
    const SHOW_MS = p.showMs || 1050;           // wie lange ein Herz anfangs sichtbar ist
    const SPAWN_MS = p.spawnMs || 640;          // mittlerer Abstand zwischen neuen Herzen
    const BROKEN = p.brokenRate ?? 0.22;        // Anteil 💔
    const PENALTY = p.penalty ?? 2;             // Abzug für ein getroffenes 💔
    let score = 0, left = SECONDS, running = false, spawnTimer = null, clock = null;
    const hideTimers = new Map();
    el.innerHTML = `
      <div class="stats"><span>❤️ <b id="score">0</b> / ${TARGET}</span><span>⏱️ <b id="time">${SECONDS}</b> s</span></div>
      <div class="holes">${'<button type="button" class="hole"><span class="h"></span></button>'.repeat(HOLES)}</div>
      <div class="feedback" id="cFb"></div>
      <button class="btn" id="cStart" type="button">Start</button>
      <p class="muted small">Tippe so schnell du kannst auf die ❤️ – aber Finger weg von 💔 (kostet ${PENALTY} Punkte)! Gegen Ende wird es schneller.</p>`;
    const holes = [...el.querySelectorAll(".hole")];
    const scoreEl = el.querySelector("#score"), timeEl = el.querySelector("#time");
    const fb = el.querySelector("#cFb"), startBtn = el.querySelector("#cStart");

    const hide = h => { h.classList.remove("up"); h.dataset.kind = ""; clearTimeout(hideTimers.get(h)); };
    const flash = (h, cls) => { h.classList.add(cls); setTimeout(() => h.classList.remove(cls), 180); };

    function spawn() {
      if (!running) return;
      const free = holes.filter(h => !h.dataset.kind);
      if (free.length) {
        const h = pick(free), kind = Math.random() < BROKEN ? "broken" : "heart";
        h.dataset.kind = kind;
        h.querySelector(".h").textContent = kind === "heart" ? "❤️" : "💔";
        h.classList.add("up");
        const progress = (SECONDS - left) / SECONDS;
        hideTimers.set(h, setTimeout(() => hide(h), SHOW_MS * (1 - 0.35 * progress)));
      }
      spawnTimer = setTimeout(spawn, SPAWN_MS * (0.75 + Math.random() * 0.5));
    }

    function stop() {
      running = false;
      clearTimeout(spawnTimer); clearInterval(clock);
      holes.forEach(hide);
    }

    function end(won) {
      stop();
      if (won) {
        fb.className = "feedback good";
        fb.textContent = "Super, geschafft! 🎉";
        win(p.token);
      } else {
        fb.className = "feedback bad";
        fb.textContent = `Die Zeit ist um – du hattest ${score} von ${TARGET}. Nochmal?`;
        startBtn.hidden = false;
        startBtn.textContent = "Nochmal";
      }
    }

    startBtn.addEventListener("click", () => {
      score = 0; left = SECONDS; running = true;
      scoreEl.textContent = 0; timeEl.textContent = left;
      fb.className = "feedback"; fb.textContent = "";
      startBtn.hidden = true;
      clock = setInterval(() => { left--; timeEl.textContent = left; if (left <= 0) end(false); }, 1000);
      spawn();
    });

    holes.forEach(h => h.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (!running || !h.dataset.kind) return;
      if (h.dataset.kind === "heart") { score++; flash(h, "hit"); }
      else { score = Math.max(0, score - PENALTY); flash(h, "miss"); }
      hide(h);
      scoreEl.textContent = score;
      if (score >= TARGET) end(true);
    }));

    return stop;
  }

  // ---------- Spiel 6: Über uns ----------
  function runQuiz(el, p, win) {
    const canonicals = [];
    let k = 0, timer = null;

    function showQ() {
      const q = p.questions[k];
      let hintsShown = 0, wrong = 0;
      el.innerHTML = `
        <p class="muted" style="margin:0">Frage ${k + 1} von ${p.questions.length}</p>
        <h3>${esc(q.q)}</h3>
        <form class="answer-row" autocomplete="off">
          <input type="text" placeholder="Deine Antwort …" aria-label="Deine Antwort"
                 autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
          <button class="btn" type="submit">Prüfen</button>
        </form>
        <div class="feedback" aria-live="polite"></div>
        <ul class="hints"></ul>
        ${q.hints.length ? '<button class="btn-ghost" id="hint" type="button">Tipp anzeigen 💡</button>' : ""}`;
      const form = el.querySelector("form"), input = form.querySelector("input"), check = form.querySelector("button");
      const fb = el.querySelector(".feedback"), hintBtn = el.querySelector("#hint");
      input.focus();

      if (hintBtn) hintBtn.addEventListener("click", () => {
        const li = document.createElement("li");
        li.textContent = q.hints[hintsShown++];
        el.querySelector(".hints").appendChild(li);
        hintBtn.classList.remove("pulse");
        if (hintsShown >= q.hints.length) hintBtn.hidden = true;
        else hintBtn.textContent = "Noch ein Tipp 💡";
      });

      form.addEventListener("submit", async e => {
        e.preventDefault();
        if (!input.value.trim()) return;
        check.disabled = true;
        fb.className = "feedback"; fb.textContent = "…";
        let result = null;
        try { result = await checkAnswer(q, input.value); } catch (err) { console.error(err); }
        check.disabled = false;
        if (result === null) {
          wrong++;
          fb.className = "feedback bad"; fb.textContent = pick(WRONG);
          shake(form);
          if (wrong >= 2 && hintBtn && !hintBtn.hidden) hintBtn.classList.add("pulse");
          input.select();
          return;
        }
        canonicals.push(result);
        form.hidden = true;
        if (hintBtn) hintBtn.hidden = true;
        fb.className = "feedback good pop";
        fb.innerHTML = `${pick(RIGHT)}<br><span class="hand sub">${esc(result)}</span>`;
        timer = setTimeout(() => {
          k++;
          if (k < p.questions.length) showQ();
          else { el.innerHTML = ""; win(canonicals.join("\n")); }
        }, 1300);
      });
    }

    showQ();
    return () => clearTimeout(timer);
  }

  // ---------- Finale ----------
  function showFinal(res) {
    setView(`
      <section class="card"><div class="card-inner">
        <div class="deco">♥</div>
        <h2>Der Tresor ist offen!</h2>
        <div class="stage" id="stage"><div class="door"><div class="wheel"></div></div></div>
        <div id="after" hidden>
          <p class="hand sub" id="message"></p>
          <a class="btn" id="download" download="Geschenk${esc(DATA.vault.ext)}">Bild speichern ⬇</a>
          <p><button class="btn-ghost" id="home" type="button">← Zurück zum Tresor</button></p>
        </div>
      </div></section>
    `);
    const stage = app.querySelector("#stage");
    app.querySelector("#message").textContent = res.message;
    app.querySelector("#home").addEventListener("click", () => { location.hash = ""; });
    const url = URL.createObjectURL(new Blob([res.image], { type: DATA.vault.mime }));
    app.querySelector("#download").href = url;
    const img = new Image();
    img.alt = "Dein Geschenk";
    img.onload = () => {
      stage.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
      setTimeout(() => stage.classList.add("turn"), 300);
      setTimeout(() => stage.classList.add("open"), 1300);
      setTimeout(() => { burst(70); app.querySelector("#after").hidden = false; }, 2600);
    };
    img.src = url;
    stage.prepend(img);
  }

  function burst(n) {
    const items = ["❤️", "⭐", "💕", "✨", "🎉", "💖"];
    for (let i = 0; i < n; i++) {
      const el = document.createElement("span");
      el.className = "confetti";
      el.textContent = pick(items);
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = 16 + Math.random() * 22 + "px";
      el.style.animationDuration = 2.4 + Math.random() * 2.6 + "s";
      el.style.animationDelay = Math.random() * 0.8 + "s";
      el.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }
  }

  // Ohne HTTPS stellt der Browser keine Verschlüsselung (crypto.subtle) bereit.
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
    const httpsUrl = "https://" + location.host + location.pathname;
    app.innerHTML = `
      <section class="card"><div class="card-inner">
        <div class="deco">♥</div>
        <h2>Fast geschafft …</h2>
        <p>Diese Seite funktioniert nur über eine sichere Verbindung.</p>
        <a class="btn" href="${esc(httpsUrl)}">Sicher öffnen 🔒</a>
        <p class="muted small">Falls das noch nicht klappt, versuch es in ein paar Minuten nochmal.</p>
      </div></section>`;
    return;
  }

  route();
})();
</script>
